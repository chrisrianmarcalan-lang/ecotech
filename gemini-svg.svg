<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <defs>
    <!-- Gradiente dorado degradado para el cuadro -->
    <linearGradient id="gold-box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Sombra suave para el cuadro -->
    <filter id="gold-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#B45309" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Cuadro dorado degradado -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#gold-box-grad)" filter="url(#gold-shadow)" />

  <!-- Corazón en color blanco -->
  <g transform="translate(12, 12)" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
    <path d="M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08v0c.82.82 2.13.85 3 .07l2.07-1.9a1 1 0 0 1 1.42 0l.63.63a1 1 0 0 1 0 1.42l-2.07 1.9" />
  </g>

  <!-- Texto corporativo -->
  <text x="54" y="30" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" letter-spacing="-0.025em">
    <tspan font-weight="800" fill="#0f172a">EcoTech</tspan>
    <tspan font-weight="600" fill="#f59e0b"> Solutions</tspan>
  </text>
</svg>